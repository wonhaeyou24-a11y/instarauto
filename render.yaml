services:
  - type: web
    name: instagram-creator-studio
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: UNSPLASH_ACCESS_KEY
        sync: false
    disk:
      name: creator-studio-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
